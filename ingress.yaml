apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cs122b-project-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /cs122b-project/login
            pathType: Prefix
            backend:
              service:
                name: cs122b-project-login-service
                port:
                  number: 8080
          - path: /cs122b-project/login.jsp
            pathType: Exact
            backend:
              service:
                name: cs122b-project-login-service
                port:
                  number: 8080
          - path: /cs122b-project
            pathType: Prefix
            backend:
              service:
                name: cs122b-project-movies-service
                port:
                  number: 8080
